<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="trophyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#090d16" />
  <circle cx="256" cy="256" r="180" fill="url(#grad)" opacity="0.15" />
  <g filter="url(#glow)">
    <!-- Trophy cup -->
    <path d="M160 144 C160 270, 352 270, 352 144 L352 112 L160 112 Z" fill="url(#trophyGrad)" />
    <!-- Left handle -->
    <path d="M160 140 C110 140, 110 210, 160 220" fill="none" stroke="#fbbf24" stroke-width="24" stroke-linecap="round" />
    <!-- Right handle -->
    <path d="M352 140 C402 140, 402 210, 352 220" fill="none" stroke="#fbbf24" stroke-width="24" stroke-linecap="round" />
    <!-- Stem & Base -->
    <rect x="238" y="250" width="36" height="70" rx="8" fill="#d97706" />
    <path d="M176 340 L336 340 L316 384 L196 384 Z" fill="url(#trophyGrad)" />
    <!-- Star on Trophy -->
    <polygon points="256,150 263,172 286,172 268,186 274,208 256,194 238,208 244,186 226,172 249,172" fill="#ffffff" opacity="0.9" />
  </g>
</svg>
